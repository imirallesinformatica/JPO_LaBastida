<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6f9;
      text-align: center;
    }
    h2 { margin-top: 20px; font-size: 22px; }
    #scanner-container {
      width: 100%;
      max-width: 400px;
      margin: 20px auto;
    }
    video { width: 100%; border-radius: 8px; display: block; }
    canvas { display: none; }
    #resultado {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
      box-sizing: border-box;
      z-index: 999;
    }
    .ok      { background-color: #28a745; color: white; }
    .error   { background-color: #dc3545; color: white; }
    .warning { background-color: #ffc107; color: black; }
    .titulo  { font-size: 40px; font-weight: bold; margin-bottom: 20px; }
    .subtexto {
      font-size: 24px;
      margin-bottom: 30px;
      max-width: 90%;
      word-wrap: break-word;
      line-height: 1.5;
    }
    .boton {
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: white;
      color: black;
    }
    #error-camara {
      color: #dc3545;
      font-size: 16px;
      padding: 20px;
      display: none;
    }
    #loading {
      font-size: 16px;
      color: #555;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<h2>Validació QR - Graduació 2026</h2>
<p id="loading">Iniciant càmera...</p>

<div id="scanner-container">
  <video id="video" playsinline autoplay muted></video>
  <canvas id="canvas"></canvas>
</div>

<div id="error-camara">
  ❌ No s'ha pogut accedir a la càmera.<br>
  Comprova que has donat permís i que uses Chrome o Safari actualitzat.
</div>

<div id="resultado"></div>

<script>
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyjGambvCtyanlpp0Zhdj1vvdUIwXy7-v-Zx3K2RBnPA1Xh86P4PDDFylnFKS8b0d392A/exec";

  const video  = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx    = canvas.getContext('2d');
  let scanning = true;
  let stream   = null;

  function iniciarScanner() {
    scanning = true;
    document.getElementById('loading').style.display = 'block';
    document.getElementById('error-camara').style.display = 'none';

    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' },
        width:  { ideal: 1280 },
        height: { ideal: 720 }
      }
    })
    .then(function(s) {
      stream = s;
      video.srcObject = stream;
      video.play();
      document.getElementById('loading').style.display = 'none';
      requestAnimationFrame(tick);
    })
    .catch(function(err) {
      console.error('Error càmera:', err);
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error-camara').style.display = 'block';
    });
  }

  function tick() {
    if (!scanning) return;
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      canvas.width  = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height, {
        inversionAttempts: 'dontInvert'
      });

      if (code) {
        scanning = false;
        detenerScanner();
        processarQR(code.data);
        return;
      }
    }
    requestAnimationFrame(tick);
  }

  function detenerScanner() {
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
  }

  function processarQR(idQR) {
    const resultadoDiv = document.getElementById('resultado');
    resultadoDiv.style.display = 'flex';
    resultadoDiv.className = '';
    resultadoDiv.style.background = '#1a73e8';
    resultadoDiv.style.color = 'white';
    resultadoDiv.innerHTML = '<div class="titulo">⏳ Validant...</div>';

    fetch(APPS_SCRIPT_URL + "?qr=" + encodeURIComponent(idQR))
      .then(r => r.json())
      .then(function(response) {
        resultadoDiv.style.background = '';
        resultadoDiv.style.color = '';
        resultadoDiv.className = response.tipo;
        resultadoDiv.innerHTML =
          '<div class="titulo">'   + response.titulo + '</div>' +
          '<div class="subtexto">' + response.html   + '</div>' +
          '<button class="boton" onclick="volverAEscanear()">Tornar a escanejar</button>';
      })
      .catch(function(err) {
        console.error('Error validació:', err);
        resultadoDiv.style.background = '';
        resultadoDiv.style.color = '';
        resultadoDiv.className = 'error';
        resultadoDiv.innerHTML =
          '<div class="titulo">❌ ERROR</div>' +
          '<div class="subtexto">Error de connexió amb el servidor.<br>Comprova la connexió a internet.</div>' +
          '<button class="boton" onclick="volverAEscanear()">Tornar a escanejar</button>';
      });
  }

  function volverAEscanear() {
    const resultadoDiv = document.getElementById('resultado');
    resultadoDiv.style.display = 'none';
    resultadoDiv.style.background = '';
    resultadoDiv.style.color = '';
    iniciarScanner();
  }

  iniciarScanner();
</script>
</body>
</html>
